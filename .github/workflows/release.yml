# Pushing a tag like v0.5.0 builds the app for NextUI with that version and publishes them, with their checksums, as a GitHub
# release, with the NextUI pak's zip for the Pak Store. Boombrick's Settings
# offers the latest release as an update, and the Pak Store the version
# pak.json names, so a full release's tag must match it. A tag with a suffix,
# like v0.5.0-beta.1, is a beta: a pre-release, which GitHub's latest release,
# and so Settings, leaves out, as does the Pak Store.
name: Release

on:
  push:
    tags: ['v*', 'V*'] # V0.7.5 as well as v0.7.5, as a release made on GitHub may be tagged

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # VERSION_TAG is the tag with a small v, as pak.json and CHANGELOG.md
      # write it; the release itself keeps the tag it was made with.
      - name: Version
        run: echo "VERSION_TAG=v${GITHUB_REF_NAME#[vV]}" >> "$GITHUB_ENV"
      - name: Pak Store version
        run: |
          case "$VERSION_TAG" in *-*) exit 0 ;; esac
          v="$(jq -r .version pak.json)"
          [ "$v" = "$VERSION_TAG" ] || { echo "pak.json says $v, the tag is $GITHUB_REF_NAME" >&2; exit 1; }
      # The Makefile builds the toolchain image with the Go that go.mod asks for.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # Settings must check this fork's releases for updates, never
      # upstream's: a release whose app would ask elsewhere stops here.
      - name: Updates check this fork
        run: go test ./internal/version/
      # The toolchain's container writes as root; folders made first stay the
      # runner's, so the steps after it can write beside what it built.
      - name: Build
        run: |
          mkdir -p dist/tg5040 dist/qjs
          make pak VERSION="${VERSION_TAG#v}"
      - name: Checksums
        working-directory: dist
        run: sha256sum Boombrick-B-Side.pak.zip Boombrick-B-Side-PakStore.zip > SHA256SUMS
      # The notes are the tag's section of CHANGELOG.md, from its "## [v…]"
      # heading to the next, with the coffee link after it; GitHub's own when
      # there is none.
      - name: Release notes
        run: |
          awk -v head="## [$VERSION_TAG]" '
            index($0, "## [") == 1 { if (on) exit; on = ($0 == head); next }
            on
          ' CHANGELOG.md > dist/NOTES.md
          if grep -q '[^[:space:]]' dist/NOTES.md; then
            printf "\nBoombrick is free. If you'd like to help keep it going, you can [buy me a coffee](https://buymeacoffee.com/ujjwal_).\n" >> dist/NOTES.md
          fi
      # A release made by hand on GitHub, which made the tag, gets the files
      # added to it; otherwise the release is made here.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="dist/Boombrick-B-Side.pak.zip dist/Boombrick-B-Side-PakStore.zip dist/SHA256SUMS"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
            exit 0
          fi
          flags="--notes-file dist/NOTES.md"
          grep -q '[^[:space:]]' dist/NOTES.md || flags="--generate-notes"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $files \
            --title "Boombrick B-Side ${VERSION_TAG#v}" $flags
